<?xml version="1.0" encoding="UTF-8"?>
<!-- Ícone do NEXUS (desenho próprio). Fundo da "bancada de telemetria" (#0E1320) e um traço âmbar (#FFB547) que forma um
     N como a linha de um gráfico: sai da base, sobe, cruza na diagonal e sobe de novo, com um ponto de medida no fim.
     Fonte única: tools/packaging/icon/build_icon.py gera daqui o .ico multi-resolução e as imagens do instalador. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <rect x="2" y="2" width="60" height="60" rx="13" ry="13" fill="#0E1320"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="12.4" ry="12.4" fill="none" stroke="#FFB547" stroke-opacity="0.22" stroke-width="1.5"/>
  <path d="M10 44 H17 V20 L39 44 V20 H45" fill="none" stroke="#FFB547" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="51" cy="20" r="4.2" fill="#FFB547"/>
</svg>
