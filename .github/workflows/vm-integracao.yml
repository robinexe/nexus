# NEXUS — testes de integração REAIS (registro, energia, serviços, crash + nexus-recover) numa VM Windows
# descartável do GitHub Actions (Azure). Substitui o Windows Sandbox, que não existe no Windows Home.
#
# Nada disto roda no PC de ninguém: a VM é criada para o job e destruída no fim. O portão do NEXUS continua valendo:
# só é liberado se o SMBIOS indicar máquina virtual e o arquivo de liberação existir com o nome DESTA máquina,
# pertencente a Administradores. O script recusa criar a liberação se a descoberta não disser "Máquina virtual: Sim".
name: vm-integracao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-integracao.yml'
      - 'tests/Nexus.IntegrationTests/**'
      - 'src/**'
      - 'catalog/**'
      - 'tools/service/**'

permissions:
  contents: read

jobs:
  integracao:
    # "Qualquer PC": o mesmo roteiro em duas versões do Windows, em paralelo (cada uma numa VM descartável própria).
    # windows-2022 = base do Windows 10 21H2/Server 2022; windows-2025 = base do Windows 11 24H2/Server 2025.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (Release, lock files)
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet restore Nexus.slnx --locked-mode
          dotnet build Nexus.slnx -c Release --no-restore
          dotnet build tests/Nexus.IntegrationTests -c Release
          dotnet build tools/Nexus.Discover -c Release

      - name: Testes unitários (Windows Server)
        shell: pwsh
        run: dotnet test Nexus.slnx -c Release --no-build --filter Category=Unit --logger "trx;LogFileName=unit.trx" --results-directory saida

      - name: Autoteste no PC (nexus selftest, somente leitura, antes de qualquer escrita)
        shell: pwsh
        run: |
          # Lê o estado limpo da VM com todas as leituras dos módulos. O veredito (falhar o job se houver FALHA) fica para o
          # passo "Veredito dos autotestes", no fim: assim uma falha aqui não esconde os testes de integração.
          New-Item -ItemType Directory -Force -Path saida | Out-Null
          & src/Nexus.Cli/bin/Release/net10.0/nexus.exe selftest --json saida/selftest.json --html saida/selftest.html
          "$LASTEXITCODE" | Out-File saida/selftest.exitcode -Encoding ascii
          "nexus selftest: código $LASTEXITCODE (0 = sem FALHA)"

      - name: Descoberta e liberação do portão (só se for VM)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path saida | Out-Null
          $disc = & dotnet tools/Nexus.Discover/bin/Release/net10.0/Nexus.Discover.dll --rows 5 2>&1 | ForEach-Object { "$_" }
          $disc | Out-File saida/descoberta.txt -Encoding utf8
          $disc | Select-String 'Máquina virtual|Fabricante do sistema|Modelo do sistema|Processo elevado|Build'
          if (-not ($disc -match 'Máquina virtual: Sim')) { Write-Error 'SMBIOS não indica máquina virtual: liberação NÃO criada.'; exit 11 }
          New-Item -ItemType Directory -Force -Path C:\ProgramData\NEXUS | Out-Null
          $marker = 'C:\ProgramData\NEXUS\vm-test-host.allow'
          [System.IO.File]::WriteAllText($marker, $env:COMPUTERNAME, (New-Object System.Text.UTF8Encoding($false)))
          icacls $marker /setowner '*S-1-5-32-544'
          icacls $marker /inheritance:r /grant:r '*S-1-5-32-544:F' '*S-1-5-18:F' '*S-1-5-32-545:R'
          "Liberação criada para $env:COMPUTERNAME"

      - name: Estado inicial diferente do desejado (só nesta VM descartável)
        shell: pwsh
        run: |
          # A imagem do runner já vem em Alto desempenho e com core parking AC no valor desejado: sem isto, os testes de
          # energia caem no ramo "já configurado" e não exercitam aplicação/reversão real.
          powercfg /setactive 381b4222-f694-41f0-9685-ff5bb260df2e
          powercfg /setacvalueindex SCHEME_CURRENT 54533251-82be-4824-96c1-47b60b740d00 0cc5b647-c1df-4637-891a-dec35c318583 50
          powercfg /setactive SCHEME_CURRENT
          powercfg /getactivescheme
          powercfg /query SCHEME_CURRENT 54533251-82be-4824-96c1-47b60b740d00 0cc5b647-c1df-4637-891a-dec35c318583

      - name: Testes de integração (handlers reais, elevado)
        shell: pwsh
        run: dotnet test tests/Nexus.IntegrationTests -c Release --no-build --filter Category=VmIntegration --logger "console;verbosity=detailed" --logger "trx;LogFileName=integracao.trx" --results-directory saida

      - name: Aplicador sob demanda (como a interface aplica neste PC, sem serviço)
        shell: pwsh
        env:
          NEXUS_ALLOW_WRITABLE_BROKER_DIR: '1'   # a pasta bin do checkout é gravável; no produto instalado não é
        run: |
          dotnet test tests/Nexus.IntegrationTests -c Release --no-build --filter Category=LocalBrokerIntegration --logger "console;verbosity=detailed" --logger "trx;LogFileName=sob-demanda.trx" --results-directory saida
          Start-Sleep -Seconds 10   # o aplicador sob demanda encerra quando o processo de teste termina

      - name: Ponta a ponta (assistente completo + atualizar drivers, aplicador real)
        if: ${{ !cancelled() }}   # roda mesmo se um teste de integração anterior falhar (o portão já foi liberado ou recusa sozinho)
        shell: pwsh
        timeout-minutes: 30
        env:
          NEXUS_ALLOW_WRITABLE_BROKER_DIR: '1'
          NEXUS_E2E_OUT: ${{ github.workspace }}\saida\e2e
        run: |
          # ANTES de instalar o serviço: com o serviço instalado, o nível administrador iria para ele e não para o aplicador
          # sob demanda que a interface usa num PC comum. Gera saida/e2e: logs, JSON por teste, estado salvo e o relatório HTML.
          New-Item -ItemType Directory -Force -Path saida/e2e | Out-Null
          dotnet test tests/Nexus.IntegrationTests -c Release --no-build --filter Category=E2E --logger "console;verbosity=detailed" --logger "trx;LogFileName=e2e.trx" --results-directory saida
          "$LASTEXITCODE" | Out-File saida/e2e.exitcode -Encoding ascii
          "ponta a ponta: código $LASTEXITCODE (0 = tudo aprovado); o veredito fica para o fim, para não pular os testes do serviço"
          Start-Sleep -Seconds 10   # o aplicador sob demanda encerra quando o processo de teste termina

      - name: Instalar o broker como serviço (LocalSystem)
        shell: pwsh
        run: |
          # Valor inicial diferente do desejado no HKCU do usuário da VM (o cliente), para o teste exercitar escrita real.
          reg add HKCU\Software\Microsoft\GameBar /v AutoGameModeEnabled /t REG_DWORD /d 0 /f
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/service/Install-Broker.ps1 -Start
          Get-Service NexusBroker | Format-List Name,Status,StartType
          icacls "$env:ProgramData\NEXUS"
          icacls "$env:ProgramData\NEXUS\nexus.lock"

      - name: Testes do serviço (cliente = usuário da VM)
        shell: pwsh
        env:
          NEXUS_SERVICE_TEST: '1'
        run: dotnet test tests/Nexus.IntegrationTests -c Release --no-build --filter Category=ServiceIntegration --logger "console;verbosity=detailed" --logger "trx;LogFileName=servico.trx" --results-directory saida

      - name: Log do serviço e desinstalação
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path saida | Out-Null
          $log = "$env:ProgramData\NEXUS\broker.log"
          if (Test-Path $log) { Copy-Item $log saida/broker.log; Get-Content $log }
          if (Get-Service NexusBroker -ErrorAction SilentlyContinue) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/service/Uninstall-Broker.ps1
            if (Get-Service NexusBroker -ErrorAction SilentlyContinue) { Write-Error 'Serviço não foi removido.'; exit 1 }
          }

      - name: Autoteste da interface (--selftest-ui, sessão gráfica do runner)
        if: always()
        shell: pwsh
        timeout-minutes: 25
        run: |
          # Os runners windows-latest hospedados pelo GitHub rodam numa sessão interativa (com área de trabalho), então a
          # janela WPF abre de verdade e cada página é aberta, desenhada e fotografada. Se um dia o processo estiver na
          # sessão 0 (serviço, sem área de trabalho), o passo registra o motivo e não conta como falha.
          New-Item -ItemType Directory -Force -Path saida/ui | Out-Null
          $session = (Get-Process -Id $PID).SessionId
          "Sessão do Windows: $session · interativo: $([Environment]::UserInteractive)"
          if ($session -eq 0) {
            Write-Warning 'Sem sessão gráfica (sessão 0): autoteste da interface não executado.'
            'sem sessao grafica' | Out-File saida/ui/ui.exitcode -Encoding ascii
            exit 0
          }
          $exe = Resolve-Path 'src/Nexus.Desktop/bin/Release/net10.0-windows/Nexus.Desktop.exe'
          $out = Join-Path $PWD 'saida/ui/ui.json'
          # O Windows do runner é em inglês; sem --lang a interface seguiria o Windows e o pt-BR nunca seria aberto aqui.
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-ui', ('"' + $out + '"'), '--lang', 'pt-BR' -PassThru
          $null = $p.Handle   # sem isto o ExitCode do Start-Process pode vir vazio
          $prog = Join-Path $PWD 'saida/ui/ui.progress.txt'
          $limit = [DateTime]::UtcNow.AddMinutes(14)
          while (-not $p.WaitForExit(60000) -and [DateTime]::UtcNow -lt $limit) {
            if (Test-Path $prog) { "--- andamento: $((Get-Content $prog -Tail 1))" }
          }
          if (-not $p.HasExited) {
            $p.Kill(); 'tempo' | Out-File saida/ui/ui.exitcode -Encoding ascii
            Write-Warning 'A interface não terminou em 14 min. Últimos passos e diagnóstico:'
            if (Test-Path $prog) { Get-Content $prog -Tail 15 }
            $diag = Join-Path $env:LOCALAPPDATA 'NEXUS\desktop-diag.log'
            if (Test-Path $diag) { Get-Content $diag -Tail 40 }
            exit 0
          }
          $p.WaitForExit()
          "$($p.ExitCode)" | Out-File saida/ui/ui.exitcode -Encoding ascii
          if (Test-Path $out) {
            $ui = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
            foreach ($pg in $ui.pages) { "{0,-9} {1,-28} {2,5:N1} s  exceções={3} binding={4} parada={5:N1} s" -f $pg.statusText, $pg.title, $pg.loadSeconds, $pg.exceptions.Count, $pg.bindingErrors, $pg.longestFreezeSeconds }
            & src/Nexus.Cli/bin/Release/net10.0/nexus.exe selftest --only Ajustes --quiet --ui $out --html saida/ui/relatorio.html | Out-Null
          } else { Write-Warning "ui.json não foi gravado (código $($p.ExitCode))." }

      - name: Autoteste da interface em inglês e espanhol (--lang)
        if: always()
        shell: pwsh
        timeout-minutes: 30
        run: |
          # Abre todas as páginas traduzidas de verdade (exceções, bindings quebrados, travamentos) em en e es.
          if ((Test-Path saida/ui/ui.exitcode) -and (Get-Content saida/ui/ui.exitcode).Trim() -eq 'tempo') { 'pulado: pt-BR travou' | Out-File saida/ui/ui-lang.exitcode -Encoding ascii; 'pt-BR travou; en/es pulados'; exit 0 }
          if ((Get-Process -Id $PID).SessionId -eq 0) { 'sem sessao grafica' | Out-File saida/ui/ui-lang.exitcode -Encoding ascii; exit 0 }
          $exe = Resolve-Path 'src/Nexus.Desktop/bin/Release/net10.0-windows/Nexus.Desktop.exe'
          $codes = @()
          foreach ($lang in 'en', 'es') {
            New-Item -ItemType Directory -Force -Path "saida/ui-$lang" | Out-Null
            $out = Join-Path $PWD "saida/ui-$lang/ui.json"
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest-ui', ('"' + $out + '"'), '--lang', $lang -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(900000)) { $p.Kill(); $codes += "$($lang):tempo"; continue }
            $p.WaitForExit()
            $codes += "$($lang):$($p.ExitCode)"
            if (Test-Path $out) {
              $ui = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
              foreach ($pg in $ui.pages) { "[{0}] {1,-9} {2,-28} exceções={3} binding={4}" -f $lang, $pg.statusText, $pg.title, $pg.exceptions.Count, $pg.bindingErrors }
            }
          }
          $bad = $codes | Where-Object { $_ -notmatch ':0$' }
          ($(if ($bad) { $codes -join ' ' } else { '0' })) | Out-File saida/ui/ui-lang.exitcode -Encoding ascii
          "idiomas: $($codes -join ' ')"

      - name: Diagnóstico da interface (desktop-diag.log e erros)
        if: always()
        shell: pwsh
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'NEXUS'
          foreach ($f in 'desktop-diag.log', 'desktop-erros.log') { if (Test-Path (Join-Path $d $f)) { Copy-Item (Join-Path $d $f) saida/ -Force } }
          Get-ChildItem saida -Recurse -Filter ui.progress.txt | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 6 }

      - name: Veredito dos autotestes
        if: always()
        shell: pwsh
        run: |
          $cli = if (Test-Path saida/selftest.exitcode) { (Get-Content saida/selftest.exitcode).Trim() } else { 'ausente' }
          $ui = if (Test-Path saida/ui/ui.exitcode) { (Get-Content saida/ui/ui.exitcode).Trim() } else { 'ausente' }
          $e2e = if (Test-Path saida/e2e.exitcode) { (Get-Content saida/e2e.exitcode).Trim() } else { 'ausente' }
          $lang = if (Test-Path saida/ui/ui-lang.exitcode) { (Get-Content saida/ui/ui-lang.exitcode).Trim() } else { 'ausente' }
          "nexus selftest: $cli · interface: $ui · ponta a ponta: $e2e"
          $bad = @()
          if ($e2e -ne '0') { $bad += "testes de ponta a ponta com FALHA ou sem resultado ($e2e); veja saida/e2e/*.log e saida/e2e.trx" }
          if ($cli -ne '0') { $bad += "nexus selftest com FALHA ou sem resultado ($cli); veja saida/selftest.html" }
          if ($ui -notin @('0', 'sem sessao grafica')) { $bad += "autoteste da interface com FALHA ou sem resultado ($ui); veja saida/ui/relatorio.html" }
          if ($lang -notin @('0', 'sem sessao grafica')) { $bad += "autoteste da interface em en/es com FALHA ($lang); veja saida/ui-en e saida/ui-es" }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vm-integracao-${{ matrix.os }}
          path: saida/
