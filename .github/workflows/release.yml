# NEXUS — gera os pacotes para Windows: ZIP portátil e instalador (Inno Setup), com SHA-256 de tudo.
#
# Quando roda:
#   - tag v* (ex.: v0.9.0 ou v0.9.0-rc.1): a versão da tag precisa bater com <VersionPrefix> de Directory.Build.props;
#     cria um GitHub Release em RASCUNHO (o responsável revisa e publica à mão).
#   - manual (Actions → release → Run workflow): mesma coisa, versão 0.9.0-ci.<número da execução>, sem Release; os
#     pacotes ficam nos artifacts da execução.
#
# O que confere antes de entregar (numa VM descartável do GitHub; nada roda no PC de ninguém):
#   build Release e testes unitários; estrutura da pasta publicada (tools/packaging/publish.py); instala o instalador em
#   modo silencioso, confere a pasta e a ACL, roda nexus/nexus-recover, simula uma ação pelo aplicador da pasta instalada,
#   confere o PresentMon embutido (hash, assinatura da Intel, "nexus selftest" da pasta instalada, captura real curta) e o
#   grupo "Usuários do log de desempenho", abre a interface por 20 s e desinstala (dados preservados, grupo desfeito só se
#   foi o instalador que adicionou); extrai o ZIP portátil e roda o nexus de lá.
#
# Assinatura Authenticode: preparada e DESLIGADA. Para ligar: variável de repositório NEXUS_SIGN=true e segredos
# NEXUS_SIGN_PFX_BASE64 / NEXUS_SIGN_PFX_PASSWORD (certificado de assinatura de código). Ver docs/08-packaging.md.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Também gerar win-arm64 (experimental: compila, mas não foi testado num PC ARM)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pacotes:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # só usado para criar o Release em rascunho quando for tag
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ARM64: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $prefix = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:-([0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*))?$') { Write-Error "Tag inválida: $tag (use v1.2.3 ou v1.2.3-rc.1)"; exit 1 }
            if ($Matches[1] -ne $prefix) { Write-Error "Tag $tag não bate com VersionPrefix $prefix de Directory.Build.props"; exit 1 }
            $suffix = "$($Matches[2])"
          } else {
            $suffix = "ci.$env:GITHUB_RUN_NUMBER"
          }
          $full = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          $numeric = "$prefix.$env:GITHUB_RUN_NUMBER"
          $rids = @('win-x64'); if ($env:ARM64 -eq 'true') { $rids += 'win-arm64' }
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "full=$full" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "rids=$($rids -join ' ')" >> $env:GITHUB_OUTPUT
          "NEXUS $full (arquivo $numeric) para $($rids -join ', ')"

      - name: Build e testes unitários
        shell: pwsh
        run: |
          dotnet restore Nexus.slnx --locked-mode
          dotnet build Nexus.slnx -c Release --no-restore
          dotnet test Nexus.slnx -c Release --no-build --filter Category=Unit --logger "trx;LogFileName=unit.trx" --results-directory saida

      - name: Publicar (self-contained, pasta única)
        shell: pwsh
        run: |
          $ridArgs = "${{ steps.versao.outputs.rids }}".Split(' ') | ForEach-Object { '--rid'; $_ }
          $suffixArgs = if ("${{ steps.versao.outputs.suffix }}") { @('--version-suffix', "${{ steps.versao.outputs.suffix }}") } else { @() }
          python tools/packaging/publish.py @ridArgs @suffixArgs --no-zip --out artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assinar executáveis (desligado sem certificado)
        if: vars.NEXUS_SIGN == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.NEXUS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.NEXUS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Error 'NEXUS_SIGN=true, mas o segredo NEXUS_SIGN_PFX_BASE64 não existe.'; exit 1 }
          $pfx = Join-Path $env:RUNNER_TEMP 'nexus-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error 'signtool.exe não encontrado'; exit 1 }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          # Só os binários do NEXUS; os do runtime .NET já vêm assinados pela Microsoft.
          $files = Get-ChildItem artifacts\win-*\NEXUS -Include 'Nexus.*.dll','Nexus.Desktop.exe','nexus.exe','nexus.dll','nexus-broker.exe','nexus-broker.dll','nexus-recover.exe','nexus-recover.dll' -Recurse
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ZIP portátil
        shell: pwsh
        run: |
          $ridArgs = "${{ steps.versao.outputs.rids }}".Split(' ') | ForEach-Object { '--rid'; $_ }
          $suffixArgs = if ("${{ steps.versao.outputs.suffix }}") { @('--version-suffix', "${{ steps.versao.outputs.suffix }}") } else { @() }
          python tools/packaging/publish.py @ridArgs @suffixArgs --zip-only --out artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inno Setup (já instalado no runner? senão via Chocolatey)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) {
            "Inno Setup já presente no runner: $iscc"
          } else {
            "Inno Setup não está no runner; instalando pelo Chocolatey."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) { Write-Error 'ISCC.exe não encontrado depois do choco install'; exit 1 }
          }
          (Get-Item $iscc).VersionInfo.ProductVersion
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Instalador
        shell: pwsh
        run: |
          $out = (Resolve-Path artifacts).Path
          foreach ($rid in "${{ steps.versao.outputs.rids }}".Split(' ')) {
            $src = (Resolve-Path "artifacts\$rid\NEXUS").Path
            $defs = @("/DAppVersion=${{ steps.versao.outputs.full }}", "/DNumericVersion=${{ steps.versao.outputs.numeric }}", "/DRid=$rid", "/DSourceDir=$src", "/DOutputDir=$out")
            if ($env:SIGNTOOL) {
              $defs += '/DSignToolName=nexussign'
              $defs += "/Snexussign=`"$env:SIGNTOOL`" sign /f `"$env:SIGN_PFX`" /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
            }
            & $env:ISCC /Qp @defs tools\packaging\nexus.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem artifacts -File | Format-Table Name, Length
        env:
          PFX_PASSWORD: ${{ secrets.NEXUS_SIGN_PFX_PASSWORD }}

      - name: Teste do instalador nesta VM (instala, confere, desinstala)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path saida | Out-Null
          $setup = Get-ChildItem artifacts -Filter 'NEXUS-*-win-x64-instalador.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=saida\instalacao.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content saida\instalacao.log -Tail 40; Write-Error "Instalador saiu com $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:ProgramFiles 'NEXUS'
          foreach ($f in 'Nexus.Desktop.exe','nexus-broker.exe','nexus.exe','nexus-recover.exe','catalog\actions.v1.json','unins000.exe','tools\Remove-NexusTasks.ps1','tools\service\Uninstall-Broker.ps1') {
            if (-not (Test-Path (Join-Path $app $f))) { Write-Error "Falta $f em $app"; exit 1 }
          }
          "Atalho no Menu Iniciar: $(Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\NEXUS.lnk")"
          icacls $app
          powershell -NoProfile -ExecutionPolicy Bypass -File "$app\tools\Test-NexusFolderSafety.ps1" -Path $app
          if ($LASTEXITCODE -ne 0) { Write-Error 'A pasta instalada deveria ser protegida (só administradores alteram).'; exit 1 }

          & "$app\nexus.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$app\nexus-recover.exe" scan
          "nexus-recover scan: $LASTEXITCODE (0 ou 3 esperados: nada a recuperar / diário não existe)"
          if ($LASTEXITCODE -notin 0, 3) { exit 1 }
          # O nexus inicia o aplicador (nexus-broker.exe) da própria pasta, no nível do usuário, e só simula.
          & "$app\nexus.exe" plan win.gamemode.enable
          "nexus plan: $LASTEXITCODE"
          if ($LASTEXITCODE -notin 0, 1) { Write-Error 'O nexus não conseguiu simular pelo aplicador da pasta instalada.'; exit 1 }

          # ---- PresentMon embutido: presente, intacto, assinado pela Intel, avisos de terceiros junto.
          $pm = Join-Path $app 'tools\PresentMon\PresentMon.exe'
          foreach ($f in $pm, (Join-Path $app 'tools\PresentMon\LICENSE.txt'), (Join-Path $app 'THIRD-PARTY-NOTICES.txt'), (Join-Path $app 'tools\Set-NexusPerfLogGroup.ps1')) {
            if (-not (Test-Path $f)) { Write-Error "Falta $f"; exit 1 }
          }
          $hash = (Get-FileHash $pm -Algorithm SHA256).Hash.ToLowerInvariant()
          "PresentMon SHA-256: $hash"
          if ($hash -ne 'b2a706bc6ad475749e3b7e3409263aa1e6906d45bdcf993f6dbc0f660188f1af') { Write-Error 'PresentMon embutido difere do 2.6.0 oficial.'; exit 1 }
          $sig = Get-AuthenticodeSignature $pm
          "Assinatura: $($sig.Status) · $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=Intel Corporation') { Write-Error 'Assinatura do PresentMon não é válida da Intel Corporation.'; exit 1 }

          # ---- "nexus selftest" A PARTIR DA PASTA INSTALADA: "Medir · PresentMon encontrado?" precisa dar OK, embutido e conferido
          # (SHA-256 conhecido / WinVerifyTrust + assinante). --with-benchmarks inclui "PresentMon executa" (captura de 5 s do dwm.exe).
          $stJson = Join-Path (Resolve-Path saida).Path 'selftest-medir-instalado.json'
          Push-Location $env:TEMP
          & "$app\nexus.exe" selftest --only Medir --with-benchmarks --json $stJson
          $stCode = $LASTEXITCODE
          Pop-Location
          "nexus selftest (Medir): $stCode"
          $st = Get-Content $stJson -Raw -Encoding UTF8 | ConvertFrom-Json
          $st.results | ForEach-Object { "  [$($_.statusText)] $($_.module) · $($_.name) — $($_.summary) $($_.reason)" }
          $found = $st.results | Where-Object { $_.module -eq 'Medir' -and $_.name -eq 'PresentMon encontrado?' }
          if (-not $found -or $found.statusText -ne 'OK') { Write-Error "Medir · PresentMon encontrado? deveria ser OK; deu $($found.statusText) $($found.warnings)"; exit 1 }
          if ($found.data.origem -ne 'embutido' -or $found.data.conferido -ne $true) { Write-Error "PresentMon deveria ser o embutido e conferido (origem=$($found.data.origem), conferido=$($found.data.conferido))"; exit 1 }
          $runs = $st.results | Where-Object { $_.module -eq 'Medir' -and $_.name -like 'PresentMon executa*' }
          if ($runs.statusText -eq 'FALHA') { Write-Error "PresentMon não executou pelo autoteste: $($runs.error)"; exit 1 }
          if ($stCode -ne 0) { Write-Error "nexus selftest --only Medir saiu com $stCode"; exit 1 }

          # ---- Grupo "Usuários do log de desempenho": a opção do instalador vem marcada (também em /VERYSILENT).
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $markerKey = 'HKLM:\SOFTWARE\NEXUS\PerfLogGroup'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$app\tools\Set-NexusPerfLogGroup.ps1" -Status -Sid $me
          $memberCode = $LASTEXITCODE
          $markedByInstaller = (Get-ItemProperty -Path $markerKey -Name $me -ErrorAction SilentlyContinue).$me -eq 'installer'
          "Grupo: status $memberCode (0 = membro); marca do instalador: $markedByInstaller"
          if ($memberCode -ne 0) { Get-Content saida\instalacao.log | Select-String 'PerfLogGroup' ; Write-Error 'O instalador deveria ter colocado a conta no grupo Usuários do log de desempenho.'; exit 1 }

          # ---- Captura REAL curta com o PresentMon da pasta instalada (prova de que funciona fora do repositório). A conta do
          # runner é administradora, então roda sem --restart_as_admin. A interface do NEXUS (WPF/Direct3D) fica aberta durante
          # a captura para haver quadros; o dwm.exe também é medido. VM sem GPU: o Windows usa o adaptador básico (WARP) e
          # costuma apresentar quadros; se vier 0, fica registrado como aviso (o PresentMon executou com permissão).
          $ui = Start-Process "$app\Nexus.Desktop.exe" -PassThru
          Start-Sleep -Seconds 8
          foreach ($proc in 'Nexus.Desktop.exe', 'dwm.exe') {
            $csv = Join-Path (Resolve-Path saida).Path "presentmon-$proc.csv"
            $pmArgs = @('--process_name', $proc, '--output_file', "`"$csv`"", '--timed', '5', '--terminate_after_timed', '--no_console_stats', '--stop_existing_session', '--session_name', 'NEXUS_CI')
            $run = Start-Process $pm -ArgumentList $pmArgs -PassThru -NoNewWindow -RedirectStandardOutput "saida\presentmon-$proc.out.txt" -RedirectStandardError "saida\presentmon-$proc.err.txt"
            $null = $run.Handle # sem isso o ExitCode pode vir vazio depois de WaitForExit(ms) com saída redirecionada
            if (-not $run.WaitForExit(60000)) { $run.Kill(); Write-Error "PresentMon ($proc) não terminou em 60 s"; exit 1 }
            $lines = if (Test-Path $csv) { @(Get-Content $csv | Where-Object { $_ }).Count } else { 0 }
            $frames = [Math]::Max(0, $lines - 1)
            "PresentMon --process_name $($proc): código $($run.ExitCode), $frames quadro(s) em 5 s"
            Get-Content "saida\presentmon-$proc.err.txt" -ErrorAction SilentlyContinue | Select-Object -First 10
            if ($run.ExitCode -ne 0) { Write-Error "PresentMon ($proc) saiu com $($run.ExitCode)"; exit 1 }
            if ($frames -eq 0) { "::warning::PresentMon executou, mas $proc não apresentou quadros em 5 s nesta VM (sem GPU/sem mudança na tela)." }
            else { Get-Content $csv -TotalCount 3 }
          }

          # A interface abre e continua aberta (falta de dll ou conflito de versão derrubaria logo no início). Já foi aberta acima,
          # para a captura do PresentMon; completa os 20 s.
          Start-Sleep -Seconds 7
          if ($ui.HasExited) {
            Get-ChildItem "$env:LOCALAPPDATA\NEXUS" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 60 }
            Write-Error "A interface fechou sozinha (código $($ui.ExitCode))."; exit 1
          }
          "Interface aberta há 20 s (PID $($ui.Id)); fechando."
          Stop-Process -Id $ui.Id -Force
          Get-Process nexus-broker -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # Marca nos dados do usuário: a desinstalação silenciosa NÃO pode apagar dados.
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\NEXUS" | Out-Null
          Set-Content "$env:LOCALAPPDATA\NEXUS\teste-desinstalacao.txt" 'não apagar'
          $log = Join-Path (Resolve-Path saida).Path 'desinstalacao.log'
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log" -Wait
          # O desinstalador continua numa cópia temporária depois que o unins000.exe original sai: espera até 90 s.
          for ($i = 0; $i -lt 90 -and (Test-Path "$app\Nexus.Desktop.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\Nexus.Desktop.exe") { if (Test-Path $log) { Get-Content $log -Tail 40 }; Write-Error 'Desinstalação não removeu o programa.'; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\NEXUS\teste-desinstalacao.txt")) { Write-Error 'Desinstalação silenciosa apagou os dados do usuário (não deveria).'; exit 1 }
          if (Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.Description -match '\[nexus\.' }) { Write-Error 'Sobrou tarefa agendada do NEXUS.'; exit 1 }
          # Grupo: o desinstalador tira só quem tem a marca do NEXUS; sem marca (já era membro antes), continua membro.
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $g = [ADSI]("WinNT://$env:COMPUTERNAME/" + (New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-559').Translate([Security.Principal.NTAccount]).Value.Split('\')[-1] + ',group')
          $stillMember = @($g.Invoke('Members') | ForEach-Object { (New-Object Security.Principal.SecurityIdentifier($_.GetType().InvokeMember('objectSid', 'GetProperty', $null, $_, $null), 0)).Value }) -contains $me
          $marker = Get-ItemProperty -Path 'HKLM:\SOFTWARE\NEXUS\PerfLogGroup' -Name $me -ErrorAction SilentlyContinue
          "Depois de desinstalar: membro = $stillMember; marca = $([bool]$marker); marca do instalador antes = $markedByInstaller"
          if ($markedByInstaller -and ($stillMember -or $marker)) { Write-Error 'O desinstalador deveria ter tirado a conta do grupo e apagado a marca.'; exit 1 }
          if (-not $markedByInstaller -and -not $stillMember) { Write-Error 'O desinstalador tirou do grupo uma conta que já era membro antes do NEXUS.'; exit 1 }
          "Desinstalado; dados preservados em $env:LOCALAPPDATA\NEXUS (padrão)."

      - name: Teste do ZIP portátil nesta VM
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts -Filter 'NEXUS-*-win-x64-portatil.zip' | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'portatil'
          Expand-Archive $zip.FullName -DestinationPath $dest -Force
          & "$dest\NEXUS\nexus.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Numa pasta do usuário o verificador precisa avisar (código 1): é o motivo de preferir o instalador para modo administrador.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dest\NEXUS\tools\Test-NexusFolderSafety.ps1" -Path "$dest\NEXUS"
          $safety = $LASTEXITCODE
          "Test-NexusFolderSafety na pasta portátil: $safety (1 esperado em pasta do usuário)"
          if ($safety -ne 1) { Write-Error "O verificador deveria avisar (1) numa pasta do usuário; deu $safety"; exit 1 }
          exit 0

      - name: SHA-256
        shell: pwsh
        run: |
          python tools/packaging/publish.py --checksums artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nexus-${{ steps.versao.outputs.full }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/version.txt
            saida/
          if-no-files-found: warn

      - name: GitHub Release (rascunho, só em tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @(
            "NEXUS ${{ steps.versao.outputs.full }} (commit $($env:GITHUB_SHA.Substring(0,10)))",
            '',
            '- NEXUS-*-instalador.exe: instala em Arquivos de Programas (pede administrador). Recomendado.',
            '- NEXUS-*-portatil.zip: extraia e abra Nexus.Desktop.exe. Leia LEIA-ME-PORTATIL.txt.',
            '',
            'SHA-256:',
            '```',
            (Get-Content artifacts\SHA256SUMS.txt -Raw).Trim(),
            '```'
          ) -join "`n"
          $notes | Out-File notas.md -Encoding utf8
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip','.exe' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          $ghArgs = @('release', 'create', $env:GITHUB_REF_NAME) + $files + @('--draft', '--title', "NEXUS ${{ steps.versao.outputs.full }}", '--notes-file', 'notas.md')
          if ("${{ steps.versao.outputs.suffix }}") { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
