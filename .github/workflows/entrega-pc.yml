# Entrega um instalador já compilado (artefato de uma execução do release.yml) num branch órfão "entrega/<versão>",
# para baixar com git/raw em máquinas onde o download de artefatos do Actions é bloqueado. Não cria release.
name: entrega-pc
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'ID da execução do release.yml', required: true }
      artifact: { description: 'Nome do artefato (ex.: nexus-1.1.0)', required: true }
permissions:
  contents: write
  actions: read
jobs:
  entrega:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art
      - name: Branch órfão só com o instalador e as somas
        env:
          ART: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          ls -la art
          exe=$(find art -name '*instalador.exe' | head -1)
          test -n "$exe"
          size=$(stat -c %s "$exe"); echo "instalador: $exe ($size bytes)"
          test "$size" -lt 99000000
          mkdir out && cp "$exe" out/ && (cd out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cd out
          git init -q -b "entrega/$ART"
          git config user.name "nexus-ci"; git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Entrega: $ART (instalador da execução ${{ inputs.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/heads/entrega/$ART"
